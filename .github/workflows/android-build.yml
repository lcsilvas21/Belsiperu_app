name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/belsiperu-v2-redisenio
      - feat/escaneo-codigo-barras-camara
      - feat/consulta-dni-automatico
      - feat/identificacion-automatica-ruc-dni
      - feat/clientes-edicion-direcciones-v1-8
      - feat/cotizacion-clientes-productos-v1-9
      - fix/registro-manual-clientes-pdf-v1-10
      - fix/catalogo-visible-cotizaciones-v1-11
      - fix/busqueda-productos-bajo-demanda-v1-12
      - feat/botones-calendario-v1-13
      - feat/configuracion-empresa-impresion-v1-14
      - fix/pie-pdf-centrado-v1-15
      - feat/disenos-pdf-moderno-corporativo-v1-16
      - feat/pdf-referencias-fieles-v1-17
      - feat/pdf-ajustes-v1-18
      - feat/pdf-adaptativo-v1-19
      - feat/acciones-proforma-v1-20
      - feat/numeracion-catalogo-excel-v1-21
      - feat/reporte-stock-kardex-v1-22
      - feat/inicio-logo-bienvenida-v1-23
      - feat/seguridad-recuperacion-v1-24
      - feat/google-play-public-v1-25
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: |
          for intento in 1 2 3; do
            echo "Intento de compilación $intento (descargas limitadas)"
            if gradle assembleDebug --stacktrace --max-workers=2 --no-parallel; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then sleep 20; fi
          done
          exit 1
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BELSIPERU-V1.25-APK-PRUEBA-PUBLICA
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Validar bundle de release (SIN FIRMA - NO PUBLICAR)
        run: gradle bundleRelease --stacktrace --max-workers=2 --no-parallel
      - name: Guardar bundle de validación no firmado
        uses: actions/upload-artifact@v4
        with:
          name: BELSIPERU-V1.25-AAB-SIN-FIRMA-NO-PUBLICAR
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
