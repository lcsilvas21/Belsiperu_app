name: Google Play - AAB firmado (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secretos de firma
        env:
          KEYSTORE_B64: ${{ secrets.BELSI_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_ALIAS: ${{ secrets.BELSI_UPLOAD_KEY_ALIAS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.BELSI_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.BELSI_UPLOAD_KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_B64 UPLOAD_ALIAS UPLOAD_STORE_PASSWORD UPLOAD_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta un secreto necesario para firmar: $key"
              exit 1
            fi
          done
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar almacén de claves de SUBIDA
        env:
          KEYSTORE_B64: ${{ secrets.BELSI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/belsiperu-upload.jks"
      - name: Crear Android App Bundle firmado
        env:
          BELSI_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/belsiperu-upload.jks
          BELSI_UPLOAD_KEY_ALIAS: ${{ secrets.BELSI_UPLOAD_KEY_ALIAS }}
          BELSI_UPLOAD_STORE_PASSWORD: ${{ secrets.BELSI_UPLOAD_STORE_PASSWORD }}
          BELSI_UPLOAD_KEY_PASSWORD: ${{ secrets.BELSI_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace --max-workers=2 --no-parallel
      - name: Verificar archivo AAB
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - name: Adjuntar AAB firmado para carga MANUAL en Play Console
        uses: actions/upload-artifact@v4
        with:
          name: BELSIPERU-V1.25-AAB-FIRMADO-PARA-PLAY-CONSOLE
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Borrar el almacén temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/belsiperu-upload.jks"
